# 手动触发：构建多架构镜像（amd64 / arm64），只推送到 GitHub Container Registry（ghcr.io）。
#
# 标签规则：默认标签 latest + 版本号（v1.12 这种形式）
#   版本号默认从 config/app.php 的 'version' 读取，也可以在手动触发时填（填 1.13 或 v1.13 都行）。
#
# 首次推送后镜像默认是私有的，需要在仓库 Packages 页面把可见性改成 Public。

name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 config/app.php，例如 1.12 或 v1.12）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析镜像名与版本号
        id: meta
        run: |
          set -euo pipefail

          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          version='${{ github.event.inputs.version }}'
          if [ -z "$version" ]; then
              version=$(grep -oP "'version'\s*=>\s*'\K[^']+" config/app.php | head -1 || true)
          fi
          version="${version#v}"

          if [ -z "$version" ]; then
              echo "未能确定版本号：请手动填写，或在 config/app.php 里补 'version'" >&2
              exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "镜像：$image   版本：v$version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 避免向仓库推送 attestations，部分镜像仓库解析不了
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
